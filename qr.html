<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAMD AR — QR Codes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; gap: 2.5rem; padding: 3rem 2rem; }
    h1 { font-size: 1rem; letter-spacing: 0.12em; text-transform: uppercase; color: #1a1a1a; }
    .grid { display: flex; gap: 2.5rem; flex-wrap: wrap; justify-content: center; }
    .card { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; border: 2px solid #1a1a1a; padding: 1.5rem; }
    .card img { width: 220px; height: 220px; display: block; }
    .name { font-size: 1rem; font-weight: 700; letter-spacing: 0.08em; color: #c8102e; }
    .url { font-size: 0.55rem; color: #999; word-break: break-all; text-align: center; max-width: 220px; }
    button { background: #c8102e; color: #fff; border: none; padding: 0.8rem 2.5rem; font-family: 'Courier New', monospace; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
    @media print { button { display: none; } }
  </style>
</head>
<body>
  <h1>CAMD AR — QR Codes</h1>

  <div class="grid">
    <div class="card">
      <div class="name">BOSTON001TW</div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=6&data=https%3A%2F%2Fgh05tlab.github.io%2Fcamd-ar%2Fcampus_ar.html%3Fspot%3D0" alt="BOSTON001TW QR" />
      <div class="url">campus_ar.html?spot=0</div>
    </div>
    <div class="card">
      <div class="name">BOSTON002TW</div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=6&data=https%3A%2F%2Fgh05tlab.github.io%2Fcamd-ar%2Fcampus_ar.html%3Fspot%3D1" alt="BOSTON002TW QR" />
      <div class="url">campus_ar.html?spot=1</div>
    </div>
    <div class="card">
      <div class="name">BOSTON003TW</div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=6&data=https%3A%2F%2Fgh05tlab.github.io%2Fcamd-ar%2Fcampus_ar.html%3Fspot%3D2" alt="BOSTON003TW QR" />
      <div class="url">campus_ar.html?spot=2</div>
    </div>
  </div>

  <button onclick="window.print()">Print / Save as PDF</button>
</body>
</html>
