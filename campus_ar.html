<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CAMD AR — Campus Experience</title>

  <link rel="preload" href="./targets.mind" as="fetch" crossorigin="anonymous">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --red: #c8102e; --black: #1a1a1a; --white: #ffffff; }
    body { background: var(--black); font-family: 'Georgia', serif; color: var(--white); overflow: hidden; height: 100dvh; width: 100dvw; }
    #ar-container { position: fixed; inset: 0; display: none; }

    /* Splash */
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: var(--black); gap: 2rem; padding: 2rem; padding-top: clamp(4rem,18vh,8rem); z-index: 100; }
    .splash-logo { width: 80px; height: 80px; background: var(--black); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; padding: 6px; outline: 3px solid var(--white); }
    .splash-logo span { display: flex; align-items: center; justify-content: center; background: var(--black); color: var(--white); font-size: 1.6rem; font-weight: 700; font-family: 'Georgia', serif; }
    .splash-title h1 { font-size: clamp(1.4rem,5vw,2rem); font-weight: 400; letter-spacing: 0.05em; text-align: center; }
    .splash-title p { font-size: 0.85rem; opacity: 0.55; margin-top: 0.4rem; font-family: 'Courier New', monospace; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; }
    .splash-spots { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; max-width: 340px; }
    .spot-chip { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 3px; padding: 0.5rem 0.8rem; font-family: 'Courier New', monospace; font-size: 0.72rem; text-align: center; }
    .spot-chip strong { color: var(--red); display: block; font-size: 0.8rem; margin-bottom: 2px; }
    #start-btn { background: var(--red); color: var(--white); border: none; padding: 1rem 3rem; font-size: 1rem; font-family: 'Georgia', serif; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    #start-btn:hover { background: #a50d26; }
    #start-btn:active { transform: scale(0.97); }

    /* AR UI overlay */
    #ar-ui { position: fixed; inset: 0; pointer-events: none; z-index: 50; display: none; }
    #ar-header { position: absolute; top: 0; left: 0; right: 0; padding: 1rem 1.2rem; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); }
    #ar-label { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; font-family: 'Courier New', monospace; opacity: 0.8; }
    #stop-btn { pointer-events: all; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 0.4rem 0.9rem; font-size: 0.7rem; font-family: 'Courier New', monospace; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; border-radius: 2px; }
    #mute-btn, #play-pause-btn { pointer-events: all; position: absolute; bottom: 5rem; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); color: white; width: 44px; height: 44px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; z-index: 60; }
    #mute-btn { right: 1.2rem; }
    #play-pause-btn { right: 4rem; }
    #scan-hint { position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%); text-align: center; font-size: 0.75rem; font-family: 'Courier New', monospace; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.5); padding: 0.5rem 1.2rem; border-radius: 2px; white-space: nowrap; transition: opacity 0.5s; }
    #scan-hint.hidden { opacity: 0; }
    .scan-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 120px; height: 120px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; animation: pulse-ring 2s ease-out infinite; }
    .scan-ring:nth-child(2) { animation-delay: 0.7s; }
    .scan-ring:nth-child(3) { animation-delay: 1.4s; }
    @keyframes pulse-ring { 0% { transform: translate(-50%,-50%) scale(0.6); opacity: 0.6; } 100% { transform: translate(-50%,-50%) scale(1.8); opacity: 0; } }
    #scan-rings { transition: opacity 0.4s; }
    #scan-rings.hidden { opacity: 0; pointer-events: none; }

    /* Loading overlay */
    #loading-overlay { position: fixed; inset: 0; background: var(--black); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; z-index: 200; }
    #loading-overlay.hidden { display: none; }
    .loader-bar { width: 200px; height: 2px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .loader-fill { height: 100%; background: var(--red); animation: loader 1.8s ease-in-out infinite; }
    @keyframes loader { 0% { width:0%;margin-left:0%; } 50% { width:60%;margin-left:20%; } 100% { width:0%;margin-left:100%; } }
    .loader-text { font-size: 0.72rem; font-family: 'Courier New', monospace; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.5; }

    /* Active spot label */
    #spot-label { position: absolute; top: 4.5rem; left: 50%; transform: translateX(-50%); background: rgba(200,16,46,0.85); color: #fff; font-family: 'Courier New', monospace; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.3rem 0.9rem; border-radius: 2px; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
    #spot-label.visible { opacity: 1; }
  </style>
</head>
<body>

  <div id="loading-overlay" class="hidden">
    <div class="splash-logo" style="width:60px;height:60px;"><span style="font-size:1.2rem">C</span><span style="font-size:1.2rem">A</span><span style="font-size:1.2rem">M</span><span style="font-size:1.2rem">D</span></div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
    <div class="loader-text">Initialising AR engine…</div>
  </div>

  <div id="splash">
    <div class="splash-logo"><span>C</span><span>A</span><span>M</span><span>D</span></div>
    <div class="splash-title" style="margin-top:0.3rem;margin-bottom:0.2rem">
      <h1 style="font-size:clamp(0.85rem,3vw,1rem);opacity:0.4;letter-spacing:0.15em;text-transform:uppercase">AR Gallery</h1>
    </div>
    <div style="text-align:center;max-width:min(92vw,400px);padding:0 0.5rem;margin-top:2rem">
      <p style="font-size:clamp(0.95rem,4vw,1.2rem);color:var(--white);line-height:1.65;margin:0">
        Hold your camera near the QR code.<br>
        <span style="color:rgba(255,255,255,0.4);font-size:0.9em">(move closer or further if needed)</span>
      </p>
    </div>
    <button id="start-btn">Start AR Experience</button>
  </div>

  <div id="ar-container"></div>

  <div id="ar-ui">
    <div id="ar-header">
      <img src="./nu_logo.png" alt="NU" style="width:36px;height:36px;object-fit:contain;">
      <span id="ar-label">Campus AR</span>
      <button id="stop-btn">✕ Exit</button>
    </div>
    <div id="spot-label"></div>
    <button id="play-pause-btn">⏸</button>
    <button id="mute-btn">🔊</button>
    <div id="scan-rings"><div class="scan-ring"></div><div class="scan-ring"></div><div class="scan-ring"></div></div>
    <div id="scan-hint">Point camera at any CAMD marker</div>
  </div>

  <script type="module">
  import * as THREE from 'three';
  import { MindARThree } from 'mindar-image-three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { STLLoader }  from 'three/addons/loaders/STLLoader.js';

  // 3 distinct marker images compiled into targets.mind (index 0/1/2).
  // Each anchor tracks a different physical marker and shows its own content.
  // One shared QR code opens this page — no ?spot= parameter needed.
  const MARKER_FILE = './targets.mind';

  let mindarThree = null, clock = null;

  const splash       = document.getElementById('splash');
  const arContainer  = document.getElementById('ar-container');
  const arUI         = document.getElementById('ar-ui');
  const loadingOverlay = document.getElementById('loading-overlay');
  const startBtn     = document.getElementById('start-btn');
  const stopBtn      = document.getElementById('stop-btn');
  const scanHint     = document.getElementById('scan-hint');
  const scanRings    = document.getElementById('scan-rings');
  const spotLabel    = document.getElementById('spot-label');
  const muteBtn      = document.getElementById('mute-btn');
  const playPauseBtn = document.getElementById('play-pause-btn');

  startBtn.addEventListener('click', startAR);
  stopBtn.addEventListener('click',  stopAR);

  // ── Video (used by Spot 2 — Caspar display) ─────────────────
  const VIDEO_URL = './game_footage.mp4';
  let videoElement = null, videoTexture = null, videoPlaying = false;

  muteBtn.addEventListener('click', () => {
    if (!videoElement) return;
    videoElement.muted = !videoElement.muted;
    muteBtn.textContent = videoElement.muted ? '🔇' : '🔊';
  });
  playPauseBtn.addEventListener('click', () => {
    if (!videoElement) return;
    if (videoPlaying) { videoElement.pause(); playPauseBtn.textContent = '▶'; }
    else              { videoElement.play();  playPauseBtn.textContent = '⏸'; }
    videoPlaying = !videoPlaying;
  });

  function createVideoTexture() {
    videoElement = document.createElement('video');
    videoElement.src = VIDEO_URL;
    videoElement.loop = videoElement.muted = videoElement.playsInline = true;
    videoElement.crossOrigin = 'anonymous';
    videoElement.pause();
    videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.minFilter = videoTexture.magFilter = THREE.LinearFilter;
    return videoTexture;
  }

  // ══════════════════════════════════════════════════════════════
  //  CONTENT BUILDERS — one per spot
  // ══════════════════════════════════════════════════════════════

  // ── Spot 0 · Robotic Bee (GLB + external PBR textures) ──────

  // Color-matched mapping: GLB lambert material name → texture part name
  const BEE_MAT_PART = {
    'lambert12':'butbutton','lambert8':'tube2','lambert6':'wingbutton',
    'lambert17':'mouthleft','lambert4':'but','lambert15':'legs',
    'layeredShader1':'mouth2','mayabee_final2_defaultMat1':'wings',
    'lambert11':'wingline','lambert13':'chilun','lambert16':'wingpin',
    'lambert7':'eyebutton','lambert3':'blackline','lambert19':'body2',
    'blinn1':'legbutton','phong1':'head_tube','lambert14':'addon',
    'lambert5':'mouthpin','lambert20':'mouth','lambert10':'pins',
    'lambert18':'head','lambert2':'antenna','lambert9':'eyes',
    'lambert21':'yellowline'
  };
  const BEE_HAS_EMISSIVE = new Set([
    'antenna','blackline','body2','but','eyebutton','eyes','head','wingpin','wings'
  ]);

  function applyBeeTextures(model) {
    const tl   = new THREE.TextureLoader();
    const base = './bee/Robotic_Bee_PBR_Textures_CS_v13b/beecolore_';
    const seen = new Set();

    model.traverse(obj => {
      if (!obj.isMesh) return;
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(mat => {
        if (seen.has(mat.uuid)) return;
        seen.add(mat.uuid);
        const part = BEE_MAT_PART[mat.name];
        if (!part) return;

        const bc = tl.load(base + part + '_BaseColor.png');
        bc.colorSpace = THREE.SRGBColorSpace;
        mat.map          = bc;
        mat.normalMap    = tl.load(base + part + '_Normal.png');
        mat.roughnessMap = tl.load(base + part + '_Roughness.png');
        mat.metalnessMap = tl.load(base + part + '_Metallic.png');
        mat.metalness    = 1.0;
        mat.roughness    = 1.0;

        if (BEE_HAS_EMISSIVE.has(part)) {
          mat.emissiveMap       = tl.load(base + part + '_Emissive.png');
          mat.emissive          = new THREE.Color(1, 1, 1);
          mat.emissiveIntensity = 0.8;
        }

        mat.needsUpdate = true;
      });
    });
  }

  function buildAerialCompanion(anchor) {
    const g = new THREE.Group();
    anchor.group.add(g);
    g.userData.type = 'aerial';

    const loader = new GLTFLoader();
    loader.load(
      './bee/bee.glb',
      (gltf) => {
        const model = gltf.scene;

        // Auto-scale: fit inside ~3.6 units
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale  = 1.8 / maxDim;
        model.scale.setScalar(scale);

        // Center model at origin
        box.setFromObject(model);
        const center = new THREE.Vector3();
        box.getCenter(center);
        model.position.sub(center);

        applyBeeTextures(model);

        model.userData.isAerial = true;
        g.add(model);
      },
      undefined,
      (err) => console.error('GLB load failed:', err)
    );

    return g;
  }

  // ── Spot 1 · BOSTON002TW — Honeybee GLB ─────────────────────
  function buildBoston002TW(anchor) {
    const g = new THREE.Group();
    anchor.group.add(g);
    const loader = new GLTFLoader();
    loader.load(
      './honeybee.glb',
      (gltf) => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        model.scale.setScalar(1.8 / maxDim);
        box.setFromObject(model);
        const center = new THREE.Vector3();
        box.getCenter(center);
        model.position.sub(center);
        g.add(model);
      },
      undefined,
      (err) => console.error('honeybee GLB load failed:', err)
    );
    return g;
  }

  // ── Spot 2 · BOSTON003TW — DIY VR Implant GLB ───────────────
  function buildBoston003TW(anchor) {
    const g = new THREE.Group();
    anchor.group.add(g);
    const loader = new GLTFLoader();
    loader.load(
      './diy_vr_implant.glb',
      (gltf) => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        model.scale.setScalar(3.6 / maxDim);
        box.setFromObject(model);
        const center = new THREE.Vector3();
        box.getCenter(center);
        model.position.sub(center);
        g.add(model);
      },
      undefined,
      (err) => console.error('diy_vr_implant GLB load failed:', err)
    );
    return g;
  }

  // ══════════════════════════════════════════════════════════════
  //  AR START / STOP
  // ══════════════════════════════════════════════════════════════

  async function startAR() {
    splash.style.display = 'none';
    loadingOverlay.classList.remove('hidden');
    arContainer.style.display = 'block';
    arUI.style.display = 'block';

    mindarThree = new MindARThree({
      container:      arContainer,
      imageTargetSrc: MARKER_FILE,
      maxTrack:       1,
      uiLoading: 'no', uiScanning: 'no', uiError: 'no',
      filterMinCF: 0.00001, filterBeta: 0.0001,
    });

    const { renderer, scene, camera } = mindarThree;

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(2, 4, 3);
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0xffffff, 0.2);
    fill.position.set(-2, 1, -2);
    scene.add(fill);

    // 3 anchors — each tracks a different physical marker (targets.mind index 0/1/2).
    // GLB models are lazy-loaded on first detection to speed up initial startup.
    const spotNames  = ['BOSTON001TW', 'BOSTON002TW', 'BOSTON003TW'];
    const builders   = [buildBoston002TW, buildAerialCompanion, buildBoston003TW];
    const anchors    = [0, 1, 2].map(i => mindarThree.addAnchor(i));
    const contents   = [null, null, null];
    let activeContent = null;

    anchors.forEach((anchor, i) => {
      let despawnTimer = null;
      anchor.onTargetFound = () => {
        if (despawnTimer) { clearTimeout(despawnTimer); despawnTimer = null; }
        // Lazy-load model on first detection
        if (!contents[i]) contents[i] = builders[i](anchor);
        anchor.group.visible = true;
        activeContent = contents[i];
        scanHint.classList.add('hidden');
        scanRings.classList.add('hidden');
        spotLabel.textContent = '📍 ' + spotNames[i];
        spotLabel.classList.add('visible');
      };
      anchor.onTargetLost = () => {
        if (despawnTimer) clearTimeout(despawnTimer);
        despawnTimer = setTimeout(() => {
          anchor.group.visible = false;
          if (activeContent === contents[i]) {
            activeContent = null;
            spotLabel.classList.remove('visible');
            scanHint.classList.remove('hidden');
            scanRings.classList.remove('hidden');
          }
        }, 3000);
      };
    });

    // Touch rotation — rotates whichever content is currently visible
    let touchStart = null;
    const onTouchStart = (e) => {
      if (e.touches.length === 1) touchStart = { x: e.touches[0].clientX };
    };
    const onTouchMove = (e) => {
      if (!touchStart || !activeContent || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - touchStart.x;
      activeContent.rotation.y += dx * 0.008;
      touchStart = { x: e.touches[0].clientX };
    };
    const onTouchEnd = () => { touchStart = null; };
    document.addEventListener('touchstart', onTouchStart, { passive: true });
    document.addEventListener('touchmove',  onTouchMove,  { passive: true });
    document.addEventListener('touchend',   onTouchEnd,   { passive: true });

    try {
      await mindarThree.start();
    } catch (err) {
      alert('Could not start AR. Make sure you are on HTTPS and camera access is granted.');
      stopAR(); return;
    }

    loadingOverlay.classList.add('hidden');
    clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      contents.forEach(c => { if (c) c.rotation.y += 0.002; });
      renderer.render(scene, camera);
    });
  }

  async function stopAR() {
    if (mindarThree) {
      try { await mindarThree.stop(); } catch(e) {}
      mindarThree.renderer.setAnimationLoop(null);
      mindarThree = null;
    }
    if (videoElement) { videoElement.pause(); videoPlaying = false; }
    arContainer.innerHTML = '';
    arContainer.style.display = 'none';
    arUI.style.display = 'none';
    loadingOverlay.classList.add('hidden');
    scanHint.classList.remove('hidden');
    scanRings.classList.remove('hidden');
    spotLabel.classList.remove('visible');
    splash.style.display = 'flex';
  }
  </script>
</body>
</html>
