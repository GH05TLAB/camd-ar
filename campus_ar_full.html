<!DOCTYPE html>
<html lang="en" data-v="2026-07-06">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CAMD AR — Campus Experience</title>

  <link rel="preload" href="./targets.mind" as="fetch" crossorigin="anonymous">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --red: #c8102e; --black: #1a1a1a; --white: #ffffff; }
    body { background: var(--black); font-family: 'Georgia', serif; color: var(--white); overflow: hidden; height: 100dvh; width: 100dvw; }
    #ar-container { position: fixed; inset: 0; display: none; }

    /* Splash */
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: var(--black); gap: 2rem; padding: 2rem; padding-top: clamp(2rem,8vh,4rem); z-index: 100; }
    .splash-logo { width: 80px; height: 80px; background: var(--black); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; padding: 6px; outline: 3px solid var(--white); }
    .splash-logo span { display: flex; align-items: center; justify-content: center; background: var(--black); color: var(--white); font-size: 1.6rem; font-weight: 700; font-family: 'Georgia', serif; }
    .splash-title h1 { font-size: clamp(1.4rem,5vw,2rem); font-weight: 400; letter-spacing: 0.05em; text-align: center; }
    .splash-title p { font-size: 0.85rem; opacity: 0.55; margin-top: 0.4rem; font-family: 'Courier New', monospace; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; }
    .splash-spots { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; max-width: 340px; }
    .spot-chip { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 3px; padding: 0.5rem 0.8rem; font-family: 'Courier New', monospace; font-size: 0.72rem; text-align: center; }
    .spot-chip strong { color: var(--red); display: block; font-size: 0.8rem; margin-bottom: 2px; }
    #start-btn { background: var(--red); color: var(--white); border: none; padding: 1rem 3rem; font-size: 1rem; font-family: 'Georgia', serif; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    #start-btn:hover { background: #a50d26; }
    #start-btn:active { transform: scale(0.97); }

    /* AR UI overlay */
    #ar-ui { position: fixed; inset: 0; pointer-events: none; z-index: 50; display: none; }
    #ar-header { position: absolute; top: 0; left: 0; right: 0; padding: 1rem 1.2rem; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); }
    #ar-label { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; font-family: 'Courier New', monospace; opacity: 0.8; }
    #stop-btn { pointer-events: all; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 0.4rem 0.9rem; font-size: 0.7rem; font-family: 'Courier New', monospace; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; border-radius: 2px; }
    #scan-hint { position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%); text-align: center; font-size: 0.75rem; font-family: 'Courier New', monospace; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.5); padding: 0.5rem 1.2rem; border-radius: 2px; white-space: nowrap; transition: opacity 0.5s; }
    #scan-hint.hidden { opacity: 0; }
    #world-lock-badge { position: absolute; bottom: 5.5rem; left: 50%; transform: translateX(-50%); font-size: 0.7rem; font-family: 'Courier New', monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; background: rgba(200,16,46,0.85); padding: 0.3rem 0.9rem; border-radius: 2px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
    #world-lock-badge.active { opacity: 1; }
    .scan-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 120px; height: 120px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; animation: pulse-ring 2s ease-out infinite; }
    .scan-ring:nth-child(2) { animation-delay: 0.7s; }
    .scan-ring:nth-child(3) { animation-delay: 1.4s; }
    @keyframes pulse-ring { 0% { transform: translate(-50%,-50%) scale(0.6); opacity: 0.6; } 100% { transform: translate(-50%,-50%) scale(1.8); opacity: 0; } }
    #scan-rings { transition: opacity 0.4s; }
    #scan-rings.hidden { opacity: 0; pointer-events: none; }

    /* Loading overlay */
    #loading-overlay { position: fixed; inset: 0; background: var(--black); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; z-index: 200; }
    #loading-overlay.hidden { display: none; }
    .loader-bar { width: 200px; height: 2px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .loader-fill { height: 100%; background: var(--red); animation: loader 1.8s ease-in-out infinite; }
    @keyframes loader { 0% { width:0%;margin-left:0%; } 50% { width:60%;margin-left:20%; } 100% { width:0%;margin-left:100%; } }
    .loader-text { font-size: 0.72rem; font-family: 'Courier New', monospace; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.5; }

    /* Active spot label */
    #spot-label { position: absolute; top: 4.5rem; left: 50%; transform: translateX(-50%); background: rgba(200,16,46,0.85); color: #fff; font-family: 'Courier New', monospace; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.3rem 0.9rem; border-radius: 2px; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
    #spot-label.visible { opacity: 1; }
  </style>
</head>
<body>

  <div id="loading-overlay" class="hidden">
    <div class="splash-logo" style="width:60px;height:60px;"><span style="font-size:1.2rem">C</span><span style="font-size:1.2rem">A</span><span style="font-size:1.2rem">M</span><span style="font-size:1.2rem">D</span></div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
    <div class="loader-text">Initialising AR engine…</div>
  </div>

  <div id="splash">
    <div class="splash-logo"><span>C</span><span>A</span><span>M</span><span>D</span></div>
    <div class="splash-title" style="margin-top:0.3rem;margin-bottom:0.2rem">
      <h1 style="font-size:clamp(0.85rem,3vw,1rem);opacity:0.7;letter-spacing:0.15em;text-transform:uppercase">AR Gallery</h1>
    </div>
    <div style="flex:0.4"></div>
    <p style="font-size:clamp(0.95rem,4vw,1.2rem);color:var(--white);line-height:1.65;margin:0;padding:0 2rem;text-align:center">
      Tap Start AR, then allow camera &amp; location access when prompted.
    </p>
    <p style="font-size:clamp(0.95rem,4vw,1.2rem);color:var(--white);opacity:0.7;line-height:1.65;margin:0;padding:0 2rem;text-align:center">
      Hold your camera near the QR code and slowly move closer or further if needed.
    </p>
    <div style="flex:1"></div>
    <button id="start-btn" style="position:absolute;bottom:2.5rem;left:50%;transform:translateX(-50%)">START AR</button>
  </div>

  <div id="ar-container"></div>

  <div id="ar-ui">
    <div id="ar-header">
      <img src="./nu_logo.png" alt="NU" style="width:36px;height:36px;object-fit:contain;">
      <span id="ar-label">Campus AR</span>
      <button id="stop-btn">✕ Exit</button>
    </div>
    <div id="spot-label"></div>
    <div id="world-lock-badge">&#x2693; Anchored in space</div>
    <div id="scan-rings"><div class="scan-ring"></div><div class="scan-ring"></div><div class="scan-ring"></div></div>
    <div id="scan-hint">Point camera at the CAMD marker</div>
  </div>

  <script type="module">
  import * as THREE from 'three';
  import { MindARThree } from 'mindar-image-three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  // Marker 002 (index 1 in targets.mind) — world-locked with weather-based lighting.
  const MARKER_FILE = './targets.mind';

  let mindarThree = null, clock = null;

  const splash       = document.getElementById('splash');
  const arContainer  = document.getElementById('ar-container');
  const arUI         = document.getElementById('ar-ui');
  const loadingOverlay = document.getElementById('loading-overlay');
  const startBtn     = document.getElementById('start-btn');
  const stopBtn      = document.getElementById('stop-btn');
  const scanHint     = document.getElementById('scan-hint');
  const scanRings    = document.getElementById('scan-rings');
  const spotLabel    = document.getElementById('spot-label');
  const lockBadge    = document.getElementById('world-lock-badge');
  startBtn.addEventListener('click', startAR);
  stopBtn.addEventListener('click',  stopAR);

  // ══════════════════════════════════════════════════════════════
  //  WORLD ANCHOR — device-orientation-based camera rotation
  // ══════════════════════════════════════════════════════════════

  let worldLocked = false;

  const QUAT_SCREEN = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  let devOrientActive = false;
  let lockCamQuat     = null;
  let lockDevQuat     = null;
  const currDevQuat   = new THREE.Quaternion();

  function onDeviceOrient(e) {
    if (!e.alpha) return;
    const r = Math.PI / 180;
    const euler = new THREE.Euler(e.beta * r, e.alpha * r, -e.gamma * r, 'YXZ');
    currDevQuat.setFromEuler(euler).multiply(QUAT_SCREEN);
    if (!lockDevQuat) lockDevQuat = currDevQuat.clone().invert();
  }

  async function startOrientationTracking() {
    if (devOrientActive) return;
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      const perm = await DeviceOrientationEvent.requestPermission().catch(() => 'denied');
      if (perm !== 'granted') return;
    }
    window.addEventListener('deviceorientation', onDeviceOrient);
    devOrientActive = true;
  }

  // ══════════════════════════════════════════════════════════════
  //  WEATHER-BASED LIGHTING
  // ══════════════════════════════════════════════════════════════

  async function getWeatherLighting() {
    const NEUTRAL = { aC: 0xffffff, aI: 0.4, dC: 0xffffff, dI: 0.9, fC: 0xffffff, fI: 0.2, dP: [2,4,3] };
    try {
      const pos = await new Promise((res, rej) =>
        navigator.geolocation.getCurrentPosition(res, rej, { timeout: 6000 })
      );
      const { latitude: lat, longitude: lon } = pos.coords;
      const api = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&current=weathercode,is_day,cloudcover&timezone=auto`;
      const data = await (await fetch(api)).json();
      const { weathercode: wc, is_day, cloudcover: cc } = data.current;

      if (!is_day) {
        return wc <= 2
          ? { aC: 0x0d1b35, aI: 0.20, dC: 0x4466bb, dI: 0.35, fC: 0x203560, fI: 0.10, dP: [1,5,2] }
          : { aC: 0x0a1020, aI: 0.12, dC: 0x202d40, dI: 0.15, fC: 0x182030, fI: 0.08, dP: [2,4,3] };
      }
      if (wc >= 95)
        return { aC: 0x2e3540, aI: 0.28, dC: 0x404d5c, dI: 0.18, fC: 0x304050, fI: 0.10, dP: [1,3,2] };
      if (wc >= 51)
        return { aC: 0x7a8fa8, aI: 0.38, dC: 0x5878a0, dI: 0.28, fC: 0x4a6890, fI: 0.14, dP: [1,4,2] };
      if (wc === 3 || cc > 70)
        return { aC: 0xd0dce8, aI: 0.65, dC: 0xbcccd8, dI: 0.38, fC: 0xc8d4dc, fI: 0.25, dP: [2,5,3] };
      if (cc > 30)
        return { aC: 0xe8eff8, aI: 0.55, dC: 0xd4e4f0, dI: 0.80, fC: 0xc0d4e8, fI: 0.20, dP: [2,5,3] };
      return { aC: 0xfff5d6, aI: 0.60, dC: 0xfff0b0, dI: 1.40, fC: 0x87ceeb, fI: 0.15, dP: [2,6,2] };
    } catch {
      return NEUTRAL;
    }
  }

  // ══════════════════════════════════════════════════════════════
  //  CONTENT BUILDER — honeybee GLB (same model as marker 001)
  // ══════════════════════════════════════════════════════════════

  function buildHoneybee(parentGroup) {
    const g = new THREE.Group();
    parentGroup.add(g);
    const loader = new GLTFLoader();
    loader.load(
      './honeybee.glb',
      (gltf) => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        model.scale.setScalar(1.8 / maxDim);
        box.setFromObject(model);
        const center = new THREE.Vector3();
        box.getCenter(center);
        model.position.sub(center);
        g.add(model);
      },
      undefined,
      (err) => console.error('honeybee GLB load failed:', err)
    );
    return g;
  }

  // ══════════════════════════════════════════════════════════════
  //  AR START / STOP
  // ══════════════════════════════════════════════════════════════

  async function startAR() {
    // 1. Motion sensors (iOS 13+ only)
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission().catch(() => {});
    }

    // 2. Location — triggers geolocation dialog; used for weather lighting.
    const weatherPromise = getWeatherLighting();

    // 3. Camera — triggered inside mindarThree.start() below.

    splash.style.display = 'none';
    loadingOverlay.classList.remove('hidden');
    arContainer.style.display = 'block';
    arUI.style.display = 'block';

    mindarThree = new MindARThree({
      container:      arContainer,
      imageTargetSrc: MARKER_FILE,
      maxTrack:       1,
      uiLoading: 'no', uiScanning: 'no', uiError: 'no',
      filterMinCF: 0.00001, filterBeta: 0.0001,
    });

    const { renderer, scene, camera } = mindarThree;

    // Default neutral lighting — replaced by weather result after mindarThree.start()
    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(2, 4, 3);
    const fill = new THREE.DirectionalLight(0xffffff, 0.2);
    fill.position.set(-2, 1, -2);
    scene.add(ambient, dir, fill);

    // Single anchor: marker 002 (index 1 in targets.mind), world-locked.
    const anchor = mindarThree.addAnchor(1);
    let content = null;
    const frozenGroup = new THREE.Group();
    frozenGroup.visible = false;
    scene.add(frozenGroup);
    let markerVisible = false;

    const _pos  = new THREE.Vector3();
    const _quat = new THREE.Quaternion();
    const _scl  = new THREE.Vector3();

    anchor.onTargetFound = () => {
      if (!content) content = buildHoneybee(frozenGroup);
      frozenGroup.visible = true;
      markerVisible = true;
      lockCamQuat = null;
      lockDevQuat = null;
      if (!worldLocked) {
        worldLocked = true;
        lockBadge.classList.add('active');
      }
      scanHint.classList.add('hidden');
      scanRings.classList.add('hidden');
      spotLabel.textContent = '⚓ BOSTON002TW';
      spotLabel.classList.add('visible');
    };

    anchor.onTargetLost = () => {
      markerVisible = false;
      if (!worldLocked) {
        frozenGroup.visible = false;
        spotLabel.classList.remove('visible');
        scanHint.classList.remove('hidden');
        scanRings.classList.remove('hidden');
        return;
      }
      // World-locked: content stays, gyroscope takes over
      lockCamQuat = camera.quaternion.clone();
      lockDevQuat = null;
      startOrientationTracking();
      scanHint.textContent = 'Walk around — scan marker to re-anchor';
      scanHint.classList.remove('hidden');
    };

    // Touch rotation
    let touchStart = null;
    const onTouchStart = (e) => { if (e.touches.length === 1) touchStart = { x: e.touches[0].clientX }; };
    const onTouchMove = (e) => {
      if (!touchStart || !content || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - touchStart.x;
      content.rotation.y += dx * 0.008;
      touchStart = { x: e.touches[0].clientX };
    };
    const onTouchEnd = () => { touchStart = null; };
    document.addEventListener('touchstart', onTouchStart, { passive: true });
    document.addEventListener('touchmove',  onTouchMove,  { passive: true });
    document.addEventListener('touchend',   onTouchEnd,   { passive: true });

    try {
      await mindarThree.start();
    } catch (err) {
      alert('Could not start AR. Make sure you are on HTTPS and camera access is granted.');
      stopAR(); return;
    }

    // Apply weather lighting
    const lx = await weatherPromise;
    ambient.color.setHex(lx.aC); ambient.intensity = lx.aI;
    dir.color.setHex(lx.dC);    dir.intensity = lx.dI;    dir.position.set(...lx.dP);
    fill.color.setHex(lx.fC);   fill.intensity = lx.fI;

    loadingOverlay.classList.add('hidden');
    clock = new THREE.Clock();

    const _deltaQuat = new THREE.Quaternion();
    renderer.setAnimationLoop(() => {
      if (markerVisible) {
        anchor.group.updateWorldMatrix(true, false);
        anchor.group.matrixWorld.decompose(_pos, _quat, _scl);
        frozenGroup.position.copy(_pos);
        frozenGroup.quaternion.copy(_quat);
        frozenGroup.scale.copy(_scl);
      }
      if (lockCamQuat && lockDevQuat) {
        _deltaQuat.multiplyQuaternions(lockDevQuat, currDevQuat);
        camera.quaternion.multiplyQuaternions(lockCamQuat, _deltaQuat);
      }
      if (content) content.rotation.y += 0.002;
      renderer.render(scene, camera);
    });
  }

  async function stopAR() {
    if (mindarThree) {
      try { await mindarThree.stop(); } catch(e) {}
      mindarThree.renderer.setAnimationLoop(null);
      mindarThree = null;
    }
    worldLocked = false;
    lockCamQuat = null;
    lockDevQuat = null;
    window.removeEventListener('deviceorientation', onDeviceOrient);
    devOrientActive = false;
    lockBadge.classList.remove('active');
    scanHint.textContent = 'Point camera at the CAMD marker';

    arContainer.innerHTML = '';
    arContainer.style.display = 'none';
    arUI.style.display = 'none';
    loadingOverlay.classList.add('hidden');
    scanHint.classList.remove('hidden');
    scanRings.classList.remove('hidden');
    spotLabel.classList.remove('visible');
    splash.style.display = 'flex';
  }
  </script>
</body>
</html>
