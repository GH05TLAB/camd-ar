<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BOSTON Sticker Generator — CAMD XR Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0e0e0e; color: #f0f0f0; font-family: Lato, sans-serif; padding: 2.5rem 2rem; }
    h1 { font-size: 1.3rem; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; }
    .sub { font-size: 0.67rem; color: #444; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 0.35rem; margin-bottom: 1.6rem; font-family: 'Courier New', monospace; }
    #dl-all { background: #fff; color: #111; border: none; padding: 0.55rem 1.5rem; font-family: Lato, sans-serif; font-weight: 900; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; margin-bottom: 0.6rem; display: block; }
    #dl-all:hover { background: #ddd; }
    #status { font-size: 0.65rem; color: #444; letter-spacing: 0.06em; margin-bottom: 2rem; font-family: 'Courier New', monospace; height: 1.2rem; }
    .grid { display: grid; grid-template-columns: repeat(5, 240px); gap: 1.8rem 1.4rem; }
    .card { display: flex; flex-direction: column; align-items: center; gap: 0.45rem; }
    canvas.preview { width: 240px; height: 240px; cursor: pointer; border: 1px solid #1e1e1e; transition: border-color 0.15s; }
    canvas.preview:hover { border-color: #888; }
    .card-id { font-family: 'Courier New', monospace; font-size: 0.6rem; color: #888; letter-spacing: 0.14em; text-transform: uppercase; }
    .card-glb { font-size: 0.57rem; color: #444; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-family: 'Courier New', monospace; }
    .card-btn { background: transparent; border: 1px solid #2a2a2a; color: #555; padding: 0.32rem 0; font-family: Lato, sans-serif; font-weight: 700; font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; width: 100%; transition: all 0.15s; }
    .card-btn:hover { border-color: #aaa; color: #aaa; }
  </style>
</head>
<body>

<h1>XR Gallery · Boston</h1>
<div class="sub">CAMD · Northeastern University · Series BOSTON001–010 · 900×900 px / 300 dpi · Real scannable QR codes</div>

<button id="dl-all">↓ Download All PNG</button>
<div id="status">Loading fonts…</div>
<div class="grid" id="grid"></div>

<script>
  const W     = 900;
  const STRIP = 110;
  const INNER = W - STRIP * 2;  // 680 px QR zone

  const BASE = 'https://gh05tlab.github.io/camd-ar/campus_ar_gamma.html?m=';

  const DATA = [
    { id: 'BOSTON001', glb: 'butterfly.glb',                           label: 'BUTTERFLY' },
    { id: 'BOSTON002', glb: 'Lizard.glb',                              label: 'LIZARD' },
    { id: 'BOSTON003', glb: 'Mechanical_Crab.glb',                     label: 'MECHANICAL CRAB' },
    { id: 'BOSTON004', glb: 'RCP_v06k_UV_SP_v01a.glb',                 label: 'RCP' },
    { id: 'BOSTON005', glb: 'RhinoTexture_v02.glb',                    label: 'RHINO' },
    { id: 'BOSTON006', glb: 'RO59F0~1.glb',                            label: 'MODEL 006' },
    { id: 'BOSTON007', glb: 'RobCre_FilterShark_SR_subspaint_v03.glb', label: 'FILTER SHARK' },
    { id: 'BOSTON008', glb: 'robotic_scorpion_v03d.glb',               label: 'ROBOTIC SCORPION' },
    { id: 'BOSTON009', glb: 'SEAHOR~1.glb',                            label: 'SEAHORSE' },
    { id: 'BOSTON010', glb: 'Spider_Robot_v02b.glb',                   label: 'SPIDER ROBOT' },
  ];

  function makeQRCanvas(url) {
    return new Promise((res, rej) => {
      const c = document.createElement('canvas');
      QRCode.toCanvas(c, url, {
        width: INNER,
        margin: 2,
        color: { dark: '#000000', light: '#ffffff' },
        errorCorrectionLevel: 'M'
      }, err => err ? rej(err) : res(c));
    });
  }

  async function buildSticker(item) {
    const cv  = document.createElement('canvas');
    cv.width  = W;
    cv.height = W;
    const ctx = cv.getContext('2d');

    // White background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, W);

    // Real QR code in centre
    const qr = await makeQRCanvas(BASE + item.id);
    ctx.drawImage(qr, STRIP, STRIP, INNER, INNER);

    // Thin black border around entire sticker
    ctx.strokeStyle = '#000000';
    ctx.lineWidth   = 5;
    ctx.strokeRect(2.5, 2.5, W - 5, W - 5);

    // Separator lines between QR zone and label strips
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, STRIP);         ctx.lineTo(W, STRIP);           // top separator
    ctx.moveTo(0, W - STRIP);     ctx.lineTo(W, W - STRIP);       // bottom separator
    ctx.moveTo(STRIP, 0);         ctx.lineTo(STRIP, W);           // left separator
    ctx.moveTo(W - STRIP, 0);     ctx.lineTo(W - STRIP, W);       // right separator
    ctx.stroke();

    const txt = (label, x, y, angle, size, weight) => {
      ctx.save();
      ctx.translate(x, y);
      if (angle) ctx.rotate(angle);
      ctx.fillStyle    = '#000000';
      ctx.font         = `${weight} ${size}px Lato, sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 0, 0);
      ctx.restore();
    };

    const num  = item.id.replace('BOSTON', '');
    const MID  = W / 2;
    const HALF = STRIP / 2;
    const fs   = Math.round(STRIP * 0.40);   // label font size
    const fsN  = Math.round(STRIP * 0.34);   // number font size (smaller)

    txt('AR GALLERY', MID,        HALF,        0,             fs,  '900');  // top
    txt(num,          MID,        W - HALF,    0,             fsN, '700');  // bottom (smaller)
    txt('BOSTON',     W - HALF,   MID,         Math.PI / 2,  fs,  '900');  // right  ← swapped
    txt('CAMD',       HALF,       MID,        -Math.PI / 2,  fs,  '900');  // left   ← swapped

    return cv;
  }

  function download(cv, id) {
    const a = document.createElement('a');
    a.download = id + '.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  }

  const ready = [];

  async function init() {
    const grid   = document.getElementById('grid');
    const status = document.getElementById('status');

    for (let i = 0; i < DATA.length; i++) {
      const item = DATA[i];
      status.textContent = `Generating ${item.id} — real QR for ${item.label}… (${i + 1}/${DATA.length})`;

      const cv = await buildSticker(item);
      ready.push({ cv, id: item.id });

      const card    = document.createElement('div');
      card.className = 'card';

      const idLbl    = document.createElement('div');
      idLbl.className = 'card-id';
      idLbl.textContent = item.id + ' · ' + item.label;

      const preview  = document.createElement('canvas');
      preview.className = 'preview';
      preview.width  = 900;
      preview.height = 900;
      preview.getContext('2d').drawImage(cv, 0, 0);
      preview.title   = `Click to download ${item.id}.png`;
      preview.onclick = () => download(cv, item.id);

      const glbLbl   = document.createElement('div');
      glbLbl.className = 'card-glb';
      glbLbl.textContent = item.glb;

      const btn = document.createElement('button');
      btn.className   = 'card-btn';
      btn.textContent = '↓ PNG';
      btn.onclick     = () => download(cv, item.id);

      card.append(idLbl, preview, glbLbl, btn);
      grid.appendChild(card);
    }

    status.textContent = `✓ All ${DATA.length} stickers ready with real QR codes — click sticker or ↓ PNG.`;

    document.getElementById('dl-all').onclick = async () => {
      for (const { cv, id } of ready) {
        download(cv, id);
        await new Promise(r => setTimeout(r, 400));
      }
    };
  }

  Promise.all([
    document.fonts.load('900 44px Lato'),
    document.fonts.load('700 38px Lato'),
  ]).then(init).catch(init);
</script>
</body>
</html>
