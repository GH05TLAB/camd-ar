<!DOCTYPE html>
<html lang="en" data-v="2026-08-07">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CAMD AR — Campus Experience</title>

  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }

  </script>

  <!-- jsQR: lightweight (~50 kB) QR-code decoder, no WASM -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --red: #c8102e; --black: #1a1a1a; --white: #ffffff; }
    body { background: #000; font-family: 'Georgia', serif; color: var(--white); overflow: hidden; height: 100dvh; width: 100dvw; }

    #cam-feed { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; display: none; }

    /* Splash */
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: var(--black); gap: 2rem; padding: 2rem; padding-top: clamp(2rem,8vh,4rem); z-index: 100; }
    .splash-logo { width: 80px; height: 80px; background: var(--black); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; padding: 6px; outline: 3px solid var(--white); }
    .splash-logo span { display: flex; align-items: center; justify-content: center; background: var(--black); color: var(--white); font-size: 1.6rem; font-weight: 700; font-family: 'Georgia', serif; }
    #start-btn { background: var(--red); color: var(--white); border: none; padding: 1rem 3rem; font-size: 1rem; font-family: 'Georgia', serif; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    #start-btn:hover { background: #a50d26; }
    #start-btn:active { transform: scale(0.97); }

    /* Farewell */
    #farewell { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-start; background: var(--black); gap: 2rem; padding: 2rem; padding-top: clamp(2rem,8vh,4rem); z-index: 150; }
    #close-btn { background: var(--red); color: var(--white); border: none; padding: 1rem 3rem; font-size: 1rem; font-family: 'Georgia', serif; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: background 0.2s, transform 0.1s; position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%); }
    #close-btn:hover { background: #a50d26; }
    #close-btn:active { transform: translateX(-50%) scale(0.97); }

    /* Loading */
    #loading-overlay { position: fixed; inset: 0; background: var(--black); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; z-index: 200; }
    #loading-overlay.hidden { display: none; }
    .loader-bar { width: 200px; height: 2px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .loader-fill { height: 100%; background: var(--red); animation: loader 1.8s ease-in-out infinite; }
    @keyframes loader { 0%{width:0%;margin-left:0%} 50%{width:60%;margin-left:20%} 100%{width:0%;margin-left:100%} }
    .loader-text { font-size: 0.72rem; font-family: 'Courier New', monospace; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.5; }

    /* AR UI */
    #ar-ui { position: fixed; inset: 0; pointer-events: none; z-index: 50; display: none; }
    /* bottom action bar replaces the old top header */
    #ar-footer { position: absolute; bottom: 0; left: 0; right: 0; padding: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.6rem; background: linear-gradient(to top, rgba(0,0,0,0.65), transparent); flex-wrap: nowrap; }
    #ar-exit-hint { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; font-family: 'Courier New', monospace; color: rgba(255,255,255,0.75); white-space: nowrap; }
    #stop-btn { pointer-events: all; background: var(--red); border: none; color: white; padding: 0.42rem 0.9rem; font-size: 0.7rem; font-family: 'Courier New', monospace; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; border-radius: 2px; white-space: nowrap; }
    #stop-btn:active { opacity: 0.85; }
    /* scan hint sits above the footer */
    #scan-hint { position: absolute; bottom: 5rem; left: 50%; transform: translateX(-50%); text-align: center; font-size: 0.75rem; font-family: 'Courier New', monospace; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.5); padding: 0.5rem 1.2rem; border-radius: 2px; white-space: nowrap; transition: opacity 0.5s; }
    #scan-hint.hidden { opacity: 0; }
    /* content title at top */
    #spot-label { position: absolute; top: 1.2rem; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-family: 'Courier New', monospace; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.3rem 0.9rem; border-radius: 2px; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
    #spot-label.visible { opacity: 1; }
  </style>
</head>
<body>

  <video id="cam-feed" autoplay playsinline muted></video>

  <div id="loading-overlay" class="hidden">
    <div class="splash-logo" style="width:60px;height:60px;"><span style="font-size:1.2rem">C</span><span style="font-size:1.2rem">A</span><span style="font-size:1.2rem">M</span><span style="font-size:1.2rem">D</span></div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
    <div class="loader-text">Initialising AR engine…</div>
  </div>

  <div id="splash">
    <div class="splash-logo"><span>C</span><span>A</span><span>M</span><span>D</span></div>
    <div class="splash-title" style="margin-top:0.3rem;margin-bottom:0.2rem">
      <h1 style="font-size:clamp(0.85rem,3vw,1rem);opacity:0.7;letter-spacing:0.15em;text-transform:uppercase">XR Gallery</h1>
    </div>
    <div style="flex:0.4"></div>
    <p style="font-size:clamp(0.95rem,4vw,1.2rem);color:var(--white);line-height:1.65;margin:0;padding:0 2rem;text-align:center">
      Tap "Start", allow camera access and hold it near the QR code.
    </p>
    <div style="flex:1"></div>
    <button id="start-btn" style="position:absolute;bottom:2.5rem;left:50%;transform:translateX(-50%)">START</button>
  </div>

  <div id="farewell">
    <div class="splash-logo"><span>C</span><span>A</span><span>M</span><span>D</span></div>
    <div class="splash-title" style="margin-top:0.3rem;margin-bottom:0.2rem">
      <h1 style="font-size:clamp(0.85rem,3vw,1rem);opacity:0.7;letter-spacing:0.15em;text-transform:uppercase">XR Gallery</h1>
    </div>
    <div style="flex:0.2"></div>
    <p style="font-size:clamp(1.3rem,5vw,1.7rem);font-family:'Georgia',serif;font-weight:400;letter-spacing:0.08em;text-align:center">THANK YOU!</p>
    <p style="font-size:clamp(0.95rem,4vw,1.2rem);color:var(--white);line-height:1.65;margin:0;padding:0 2rem;text-align:center;opacity:0.8">
      Close this tab and open camera again to continue exploring CAMD XR Gallery.
    </p>
    <div style="flex:1"></div>
    <button id="close-btn">CLOSE</button>
  </div>

  <div id="ar-ui">
    <div id="spot-label">HONEYBEE</div>
    <div id="scan-hint">Point camera at any CAMD marker</div>
    <div id="ar-footer">
      <span id="ar-exit-hint">To end the experience tap</span>
      <button id="stop-btn">✕ Exit</button>
    </div>
  </div>

  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  // Start downloading the GLB immediately. Use loader.load() (not loadAsync) so we
  // can track real download progress and update the loading screen with a percentage.
  let _glbPct = 0;
  const _glbPreload = new Promise(resolve => {
    new GLTFLoader().load(
      './honeybee.glb?v=2',
      gltf => resolve(gltf),
      xhr  => { if (xhr.total) _glbPct = Math.round(xhr.loaded / xhr.total * 100); },
      ()   => resolve(null)
    );
  });

  const splash         = document.getElementById('splash');
  const farewell       = document.getElementById('farewell');
  const arUI           = document.getElementById('ar-ui');
  const loadingOverlay = document.getElementById('loading-overlay');
  const camFeed        = document.getElementById('cam-feed');
  const scanHint       = document.getElementById('scan-hint');
  const spotLabel      = document.getElementById('spot-label');

  let renderer      = null;
  let scene         = null;
  let camera        = null;
  let content       = null;
  let stream        = null;
  let qrScanTimer   = null;
  let pendingPlace  = null;   // {x, y, z} saved if QR found before model loaded
  let qrDetected    = false;  // true after first successful QR detection
  let gyroInit      = false;  // false until first gyro reading (enables snap-on-first)
  let smoothedDist  = null;   // EMA-smoothed distance estimate (metres)
  let missedScans   = 0;      // consecutive frames with no QR detection

  // Smoothed QR position — updated by scanner, consumed by render loop each frame.
  const targetPos   = new THREE.Vector3();

  // Smoothed camera quaternion — isolates micro hand-tremor from the rendered view.
  const smoothCamQ  = new THREE.Quaternion();

  // Scene light references (set in startAR, read by render loop and lighting analyser)
  let ambientLight  = null;
  let dirLight      = null;

  // Lighting targets — camera analyser writes here, render loop lerps toward them
  const lt = {
    ambColor:     new THREE.Color(1, 1, 1),
    ambIntensity: 0.7,
    dirColor:     new THREE.Color(1, 1, 1),
    dirIntensity: 0.9,
  };
  const LIGHT_LERP  = 0.04; // slow, natural-feeling light transitions
  let lightTickCount = 0;   // analyse lighting every 5th QR scan (~2 fps)

  // Touch-drag rotation state
  let userRotY   = 0;      // accumulated Y rotation set by user drag (radians)
  let autoRotY   = 0;      // slow idle spin around Y axis
  let lastTouchX = null;   // previous touch X for delta calculation

  function onTouchStart(e) {
    if (e.touches.length === 1) lastTouchX = e.touches[0].clientX;
  }
  function onTouchMove(e) {
    if (e.touches.length !== 1 || lastTouchX === null) return;
    e.preventDefault(); // stop page scroll while rotating
    const dx = e.touches[0].clientX - lastTouchX;
    lastTouchX = e.touches[0].clientX;
    userRotY += dx * 0.012; // ~180° across half the screen width
  }
  function onTouchEnd() { lastTouchX = null; }

  // Offscreen canvas — drawn at reduced size so jsQR runs fast
  const SCAN_W = 480;
  const qrCanvas = document.createElement('canvas');
  const qrCtx    = qrCanvas.getContext('2d', { willReadFrequently: true });

  // Physical size of the printed QR code (square side in metres).
  const QR_PHYSICAL_M = 0.12; // 12 cm

  // Standard Three.js DeviceOrientationControls pattern:
  // setFromEuler → multiply(QUAT_SCREEN) maps phone pan to camera yaw correctly,
  // so rotating left → content drifts right on screen (physically correct).
  const QUAT_SCREEN = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  function onDeviceOrient(e) {
    if (e.alpha == null || !camera) return;
    const raw = new THREE.Quaternion()
      .setFromEuler(new THREE.Euler(
        THREE.MathUtils.degToRad(e.beta),
        THREE.MathUtils.degToRad(e.alpha),
        -THREE.MathUtils.degToRad(e.gamma),
        'YXZ'
      ))
      .multiply(QUAT_SCREEN);
    if (!gyroInit) { smoothCamQ.copy(raw); gyroInit = true; }
    else            { smoothCamQ.slerp(raw, 0.5); } // lighter damping — more natural feel
    camera.quaternion.copy(smoothCamQ);
  }

  // Feed a fresh world-space QR position into the tracking system.
  // On first call: snaps content there instantly and reveals it.
  // On subsequent calls: only moves targetPos if the shift is > 2 cm (dead zone),
  // then lerps 40% of the way — this kills micro-jitter from QR detection noise.
  const _rawPos = new THREE.Vector3(); // reused to avoid per-scan allocation
  function updateTarget(worldX, worldY, worldZ) {
    const cY = content ? content.userData.localCenterY : 0;
    _rawPos.set(worldX, worldY - cY, worldZ);

    if (!qrDetected && content) {
      targetPos.copy(_rawPos);
      content.position.copy(targetPos);
      content.visible = true;
      qrDetected = true;
      spotLabel.classList.add('visible');
      scanHint.classList.add('hidden');
    } else if (_rawPos.distanceTo(targetPos) > 0.015) {
      // Only pull targetPos when new reading is meaningfully different
      targetPos.lerp(_rawPos, 0.55);
    }
  }

  // Analyses a raw ImageData pixel array for colour temperature and contrast.
  // Writes results into lt (lighting target); render loop lerps actual lights toward it.
  function analyzeLighting(data, w, h) {
    const SAMPLES = 300;
    const stride  = Math.max(4, Math.floor(w * h / SAMPLES) * 4);
    let rSum = 0, gSum = 0, bSum = 0, lumSum = 0;
    let count = 0;
    const lums = [];
    for (let i = 0; i + 2 < data.length; i += stride) {
      const r = data[i], g = data[i+1], b = data[i+2];
      const lum = 0.299*r + 0.587*g + 0.114*b;
      rSum += r; gSum += g; bSum += b; lumSum += lum;
      lums.push(lum);
      count++;
    }
    if (!count) return;

    const avgR = rSum / count, avgB = bSum / count;
    const avgLum = lumSum / count;

    // Luminance std-deviation → sharpness (high = direct sun, low = overcast/indoor)
    let varSum = 0;
    for (const l of lums) varSum += (l - avgLum) ** 2;
    const sharpness = Math.min(1, Math.sqrt(varSum / count) / 55);

    // Warmth: 0 = cool blue light, 1 = warm golden light
    const warmth = Math.max(0, Math.min(1, ((avgR - avgB) / (avgR + avgB + 1) + 0.15) / 0.3));

    // Overall scene brightness (controls global intensity)
    const brightness = Math.max(0.25, Math.min(1.4, avgLum / 140));

    // Directional light: warm/cool tint + intensity driven by sharpness (sun vs cloud)
    lt.dirColor.lerpColors(
      new THREE.Color(0.75, 0.85, 1.00), // cool / overcast
      new THREE.Color(1.00, 0.87, 0.52), // warm / golden
      warmth
    );
    lt.dirIntensity = brightness * (0.45 + sharpness * 0.85);

    // Ambient: complementary tint, stronger when overcast (fills shadows)
    lt.ambColor.lerpColors(
      new THREE.Color(0.55, 0.65, 0.85),
      new THREE.Color(0.65, 0.55, 0.42),
      warmth
    );
    lt.ambIntensity = brightness * (0.85 - sharpness * 0.40);
  }

  // Runs ~10 fps. Scans for any QR code; on success computes the marker's
  // 3D position from image-space location + distance estimated from apparent size.
  // Keeps running indefinitely so movement is tracked continuously.
  // Reuses the captured ImageData for lighting analysis every 5th tick.
  function scanFrame() {
    if (!camFeed.videoWidth || !camera || !window.jsQR) return;

    const vW = camFeed.videoWidth;
    const vH = camFeed.videoHeight;
    // Scale canvas width to SCAN_W; keep aspect ratio
    const sw = Math.min(vW, SCAN_W);
    const sh = Math.round(vH * sw / vW);
    if (qrCanvas.width !== sw)  qrCanvas.width  = sw;
    if (qrCanvas.height !== sh) qrCanvas.height = sh;
    qrCtx.drawImage(camFeed, 0, 0, sw, sh);

    const imageData = qrCtx.getImageData(0, 0, sw, sh);

    // Lighting analysis every 5th scan (~2 fps) — reuses the frame already captured
    lightTickCount++;
    if (lightTickCount % 5 === 0) analyzeLighting(imageData.data, sw, sh);

    const code = window.jsQR(imageData.data, sw, sh, { inversionAttempts: 'dontInvert' });
    if (!code) { missedScans++; return; }
    missedScans = 0;

    const loc = code.location;
    const corners = [loc.topLeftCorner, loc.topRightCorner, loc.bottomRightCorner, loc.bottomLeftCorner];

    // QR centre in scan-canvas pixels → normalised device coords
    const cx = (corners[0].x + corners[1].x + corners[2].x + corners[3].x) / 4;
    const cy = (corners[0].y + corners[1].y + corners[2].y + corners[3].y) / 4;
    const ndcX =  (cx / sw) * 2 - 1;
    const ndcY = -((cy / sh) * 2 - 1);

    // Area-based edge estimate — far more robust than per-edge average at distance.
    // A 1-px corner error on a 10-px QR is 10% noise on each edge, but only ~5% on area
    // because errors on opposite corners partially cancel. sqrt(area) ≈ side length.
    const area = 0.5 * Math.abs(
      corners[0].x * (corners[1].y - corners[3].y) +
      corners[1].x * (corners[2].y - corners[0].y) +
      corners[2].x * (corners[3].y - corners[1].y) +
      corners[3].x * (corners[0].y - corners[2].y)
    );
    const avgEdge = Math.sqrt(Math.max(4, area)); // guard against degenerate detection
    const focalPx = (sh / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const rawDist = Math.max(0.3, Math.min(8.0, (QR_PHYSICAL_M * focalPx) / avgEdge));

    // Adaptive EMA: alpha = 1/(1+dist) → responsive close (0.77 at 0.3m), smooth far (0.33 at 2m)
    if (smoothedDist === null) smoothedDist = rawDist;
    const alpha = Math.min(0.75, 1 / (1 + rawDist));
    smoothedDist = smoothedDist * (1 - alpha) + rawDist * alpha;
    const dist = smoothedDist;

    // Ray from virtual camera through the QR centre → world position
    const ray = new THREE.Vector3(ndcX, ndcY, 0.5)
      .unproject(camera)
      .sub(camera.position)
      .normalize();
    const worldX = camera.position.x + ray.x * dist;
    const worldY = camera.position.y + ray.y * dist;
    const worldZ = camera.position.z + ray.z * dist;

    if (content) {
      updateTarget(worldX, worldY, worldZ);
    } else {
      pendingPlace = { x: worldX, y: worldY, z: worldZ };
    }
  }

  document.getElementById('start-btn').addEventListener('click', startAR);
  document.getElementById('stop-btn').addEventListener('click', async () => {
    await stopAR();
    splash.style.display = 'none';
    farewell.style.display = 'flex';
  });
  document.getElementById('close-btn').addEventListener('click', () => { window.close(); });

  async function startAR() {
    splash.style.display = 'none';
    loadingOverlay.classList.remove('hidden');
    qrDetected   = false;
    gyroInit     = false;
    pendingPlace = null;
    userRotY     = 0;

    try {
      // 1. iOS motion permission
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission().catch(() => {});
      }

      // 2. Camera stream
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false,
      });
      camFeed.srcObject = stream;
      camFeed.style.display = 'block';
      camFeed.play().catch(() => {});

      // 3. Three.js renderer
      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      const cnv = renderer.domElement;
      Object.assign(cnv.style, { position: 'fixed', inset: '0', width: '100%', height: '100%', zIndex: '2' });
      document.body.appendChild(cnv);

      // 4. Scene
      scene  = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 0);

      ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      dirLight     = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(1, 3, 2);
      const fill   = new THREE.DirectionalLight(0xffffff, 0.2);
      fill.position.set(-1, 1, -1);
      scene.add(ambientLight, dirLight, fill);

      // Initialise lighting targets to match starting light values
      lt.ambColor.set(1, 1, 1); lt.ambIntensity = 0.7;
      lt.dirColor.set(1, 1, 1); lt.dirIntensity = 0.9;
      lightTickCount = 0;

      // 5. Model — show real download progress while awaiting the preloaded promise
      const loaderText = document.querySelector('.loader-text');
      const progressInterval = setInterval(() => {
        if (loaderText && _glbPct < 100) loaderText.textContent = `Loading model… ${_glbPct}%`;
      }, 300);
      const gltf = await _glbPreload;
      clearInterval(progressInterval);
      if (loaderText) loaderText.textContent = 'Initialising AR engine…';
      if (!gltf) throw new Error('Failed to load 3D model. Check network and try again.');
      if (!scene) return; // AR was stopped while awaiting

      // Clone so original stays clean for re-use across AR sessions
      content = gltf.scene.clone(true);

      const box  = new THREE.Box3().setFromObject(content);
      const size = new THREE.Vector3();
      box.getSize(size);
      const ns = 0.5 / Math.max(size.x, size.y, size.z);
      content.scale.setScalar(ns);
      content.userData.nominalScale = ns;

      // No rotation — natural GLB orientation is Y-up (same as alpha/beta builders).
      // Re-measure after scaling to centre X/Z.
      box.setFromObject(content);
      const center = new THREE.Vector3();
      box.getCenter(center);
      content.position.x -= center.x;
      content.position.z -= center.z;

      // localCenterY: bbox centre Y when position.y = 0.
      // updateTarget subtracts this so the model's visual centre aligns with the QR position.
      content.userData.localCenterY = center.y;

      content.visible = false;
      scene.add(content);

      if (pendingPlace) {
        updateTarget(pendingPlace.x, pendingPlace.y, pendingPlace.z);
        pendingPlace = null;
      }

      // 6. Gyroscope + QR scanning + touch rotation
      window.addEventListener('deviceorientation', onDeviceOrient);
      qrScanTimer = setInterval(scanFrame, 66); // ~15 fps scan
      cnv.addEventListener('touchstart', onTouchStart, { passive: true });
      cnv.addEventListener('touchmove',  onTouchMove,  { passive: false }); // false needed for preventDefault
      cnv.addEventListener('touchend',   onTouchEnd,   { passive: true });

      // 7. Render loop — lerp content position, apply user rotation, lerp lights
      renderer.setAnimationLoop(() => {
        if (qrDetected && content) {
          content.position.lerp(targetPos, 0.18);
          autoRotY += 0.003; // ~10°/s at 60fps — gentle idle spin
          content.rotation.y = userRotY + autoRotY;
          content.scale.setScalar(content.userData.nominalScale);
        }
        if (ambientLight) {
          ambientLight.color.lerp(lt.ambColor, LIGHT_LERP);
          ambientLight.intensity += (lt.ambIntensity - ambientLight.intensity) * LIGHT_LERP;
          dirLight.color.lerp(lt.dirColor, LIGHT_LERP);
          dirLight.intensity += (lt.dirIntensity - dirLight.intensity) * LIGHT_LERP;
        }
        renderer.render(scene, camera);
      });

      // 8. Show AR UI
      loadingOverlay.classList.add('hidden');
      arUI.style.display = 'block';

    } catch (err) {
      loadingOverlay.classList.add('hidden');
      splash.style.display = 'flex';
      const msg = err.name === 'NotAllowedError'
        ? 'Camera access denied. Please allow camera and try again.'
        : 'Could not start AR: ' + (err.message || err);
      alert(msg);
      if (stream)   { stream.getTracks().forEach(t => t.stop()); stream = null; }
      if (renderer) { renderer.dispose(); if (renderer.domElement.parentNode) renderer.domElement.remove(); renderer = null; }
      camFeed.srcObject = null;
      camFeed.style.display = 'none';
      clearInterval(qrScanTimer); qrScanTimer = null;
    }
  }

  async function stopAR() {
    clearInterval(qrScanTimer); qrScanTimer = null;
    renderer?.setAnimationLoop(null);
    window.removeEventListener('deviceorientation', onDeviceOrient);
    if (renderer?.domElement?.parentNode) renderer.domElement.remove();
    renderer?.dispose();
    renderer = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    camFeed.srcObject = null;
    camFeed.style.display = 'none';
    arUI.style.display = 'none';
    loadingOverlay.classList.add('hidden');
    qrDetected = false; gyroInit = false; pendingPlace = null; smoothedDist = null; missedScans = 0; userRotY = 0; autoRotY = 0;
    content = null; scene = null; camera = null;
    ambientLight = null; dirLight = null;
    spotLabel.classList.remove('visible');
    scanHint.classList.remove('hidden');
  }
  </script>
</body>
</html>
